name: Build & Release iOS IPA

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA (Non-AppStore Sideload)
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Quality
        run: flutter analyze

      - name: Build iOS Application (Unsigned)
        run: flutter build ios --no-codesign --release

      - name: Package into Sideloadable IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Kuroku.app
          cd build/ios/ipa
          zip -r -q Kuroku.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kuroku-iOS-Sideload
          path: build/ios/ipa/Kuroku.ipa
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ios/ipa/Kuroku.ipa
          name: Kuroku iOS Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ### Kuroku iOS Sideload Package
            
            This release includes the unsigned `Kuroku.ipa` package designed for non-AppStore installation.
            
            #### How to Install:
            - **AltStore / SideStore**: Download `Kuroku.ipa` on your iOS device and open in AltStore/SideStore.
            - **TrollStore** (iOS 14 - 17.0): Install directly with permanent entitlement without revokes.
            - **Sideloadly / Scarlet**: Drag & drop `Kuroku.ipa` to install using your Apple ID.
