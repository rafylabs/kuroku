name: Build & Release (iOS & Android)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA (Sideload)
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application (No Code Sign)
        run: flutter build ios --no-codesign --release

      - name: Package into Sideloadable IPA
        run: |
          mkdir -p build/release-assets/Payload
          cp -r build/ios/iphoneos/Runner.app build/release-assets/Payload/Kuroku.app
          cd build/release-assets
          zip -r -q Kuroku.ipa Payload
          rm -rf Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kuroku-iOS
          path: build/release-assets/Kuroku.ipa
          retention-days: 7

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare APK Asset
        run: |
          mkdir -p build/release-assets
          cp build/app/outputs/flutter-apk/app-release.apk build/release-assets/Kuroku.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kuroku-Android
          path: build/release-assets/Kuroku.apk
          retention-days: 7

  publish-release:
    name: Publish Public GitHub Release
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Kuroku-iOS
          path: release-files

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: Kuroku-Android
          path: release-files

      - name: Extract Tag and Release Notes
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          # Extract notes from CHANGELOG.md for this tag if available
          python3 -c "
          import re, sys
          tag = '${TAG}'
          clean_tag = tag.lstrip('v')
          notes = ''
          try:
              with open('CHANGELOG.md') as f:
                  content = f.read()
              pattern = r'## \[(?:v)?' + re.escape(clean_tag) + r'\].*?\n(.*?)(?=\n## \[|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(1).strip()
          except Exception:
              pass

          if not notes:
              notes = '### 📝 What\'s Changed\n- Maintenance and performance enhancements.'

          body = notes + '\n\n---\n### 📱 Direct Downloads\n'
          body += '| Platform | File | Direct Download |\n'
          body += '|---|---|---|\n'
          body += f'| **Android** | \`Kuroku.apk\` | [Download Kuroku.apk](https://github.com/${{ github.repository }}/releases/download/{tag}/Kuroku.apk) |\n'
          body += f'| **iOS** | \`Kuroku.ipa\` | [Download Kuroku.ipa](https://github.com/${{ github.repository }}/releases/download/{tag}/Kuroku.ipa) |\n'

          with open('release_notes.txt', 'w') as out:
              out.write(body)
          "

      - name: Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: "Kuroku ${{ steps.tag_info.outputs.tag }} — Cross-Platform Release"
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-files/Kuroku.ipa
            release-files/Kuroku.apk
          body_path: release_notes.txt
