<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg-opt-c" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#08182B" />
      <stop offset="55%" stop-color="#030A14" />
      <stop offset="100%" stop-color="#010307" />
    </radialGradient>

    <!-- Linear Gradient for Monolithic Emblem -->
    <linearGradient id="emblem-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="30%" stop-color="#00F0FF" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Crisp Subtle Glow -->
    <filter id="glow-c" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="core-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg-opt-c)" />
  <rect x="2" y="2" width="1020" height="1020" rx="222" fill="none" stroke="#00F0FF" stroke-opacity="0.14" stroke-width="4" />

  <!-- Ambient Internal Bloom Behind Glyph -->
  <circle cx="512" cy="512" r="260" fill="#00F0FF" opacity="0.08" filter="url(#core-glow)" />

  <!-- ============================================== -->
  <!-- OPTION C: THE MINIMALIST JAPANESE CYBER "K"    -->
  <!-- ============================================== -->
  <!--
    Architectural Balance:
    - Vertical Manga Spine: X in [250, 360] (width 110px), Y in [212, 812] (height 600px)
    - Dynamic Chevron Blade:
      Branching from (440, 512) out to (774, 212) and (774, 812)
    - Golden Ratio Negative Space between Spine and Chevron: 80px
    - Symmetrical, bold, instantly legible at 16px
  -->
  <g filter="url(#glow-c)">
    <!-- 1. Left Pillar (The Spine / Binding) -->
    <rect x="250" y="212" width="110" height="600" rx="32" fill="url(#emblem-c)" />
    <!-- 1px Top-Left Specular Catchlight -->
    <rect x="252" y="214" width="106" height="596" rx="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2" />

    <!-- 2. Upper Diagonal Chevron Blade (Page Flip) -->
    <path d="M 440 472
             L 692 220
             H 774
             L 774 302
             L 522 554
             H 440
             Z"
          fill="url(#emblem-c)" />
    <!-- Upper Blade Edge Highlight -->
    <path d="M 440 472 L 692 220 H 774" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2" />

    <!-- 3. Lower Diagonal Chevron Blade (Exact Mirror across Y=512) -->
    <path d="M 440 552
             L 692 804
             H 774
             L 774 722
             L 522 470
             H 440
             Z"
          fill="url(#emblem-c)" />

    <!-- 4. Floating Milestone Bookmark Indicator -->
    <rect x="396" y="492" width="40" height="40" rx="8" 
          transform="rotate(45 416 512)" 
          fill="#FFFFFF" 
          filter="url(#glow-c)" />
  </g>
</svg>
